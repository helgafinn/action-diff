name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Verify bundled action is tracked and current
        run: |
          git diff --exit-code -- action/
          git ls-files --error-unmatch action/index.cjs
          test -z "$(git status --porcelain --untracked-files=all -- action/)"

      - name: Verify package contents
        run: npm pack --dry-run
