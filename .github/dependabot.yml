version: 2

updates:
  # Actions are pinned to commit SHAs, which is the practice this repository's
  # own tool argues for. A pin only stays safe while somebody keeps it current,
  # so Dependabot supplies the bumps and action-diff reviews them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # engines.node is ">=24", so @types/node must stay on the 24.x line. A major
    # bump here would type-check the source against APIs the supported runtime
    # floor does not have, letting code compile that breaks for a user on 24.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
